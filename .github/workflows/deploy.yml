name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [docs-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Fetch release metadata
        run: node scripts/fetch-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install strata CLI
        run: |
          VERSION=$(node -p "require('./src/data/release.json').version")
          curl -fsSL https://stratadb.org/install.sh | STRATA_VERSION="$VERSION" sh
          echo "$HOME/.strata/bin" >> "$GITHUB_PATH"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.deployment.payload.web_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
