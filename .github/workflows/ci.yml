name: CI

on:
  push:
    branches: [redesign/v2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Fetch release metadata
        run: node scripts/fetch-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
          key: strata-cli-${{ runner.os }}
      - name: Install strata CLI
        run: |
          VERSION=$(node -p "require('./src/data/release.json').version")
          cargo install strata-cli --locked --version "$VERSION" --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}
