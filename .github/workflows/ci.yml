name: CI

on:
  push:
    branches: [redesign/v2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Fetch release metadata
        run: node scripts/fetch-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install strata CLI
        run: |
          VERSION=$(node -p "require('./src/data/release.json').version")
          curl -fsSL https://stratadb.org/install.sh | STRATA_VERSION="$VERSION" sh
          echo "$HOME/.strata/bin" >> "$GITHUB_PATH"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}
